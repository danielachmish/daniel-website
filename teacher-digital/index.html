<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מורה דיגיטלי/ת – ענן ובינה מלאכותית בהוראה</title>
<meta name="description" content="מסלול למידה אינטראקטיבי למורים מתחילים: Google Classroom, Gemini, NotebookLM ו-Google Meet לצרכים פדגוגיים.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F9FC; --card:#FFFFFF; --ink:#1F2937; --muted:#5B6474; --line:#E3E8EF;
  --primary:#1A73E8; --primary-d:#1559B5; --primary-l:#E8F0FE;
  --success:#34A853; --success-t:#1E7E34; --success-bg:#E6F4EA;
  --error:#D93025; --error-bg:#FCE8E6;
  --gold:#F9AB00; --gold-bg:#FEF7E0;
  --radius:16px;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 6px 18px rgba(16,24,40,.06);
  --shadow-h:0 12px 28px rgba(26,115,232,.22);
  --t:.2s ease;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Heebo',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;font-size:1.0625rem;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-weight:700;line-height:1.3;margin:0 0 .5em}
h1{font-size:2rem} h2{font-size:1.55rem} h3{font-size:1.2rem}
p{margin:0 0 .8em}
a{color:var(--primary)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:8px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
.skip{position:absolute;top:-60px;right:16px;background:var(--primary);color:#fff;padding:.6rem 1rem;border-radius:10px;z-index:100;text-decoration:none}
.skip:focus{top:12px}

/* ---------- Top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1120px;margin:0 auto;padding:.6rem 16px;display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.55rem;font-weight:800;font-size:1.05rem;color:var(--ink);background:none;border:none;font-family:inherit;cursor:pointer;padding:.25rem .4rem;border-radius:10px;transition:var(--t)}
.brand:hover{background:var(--primary-l)}
.brand-logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#1A73E8,#34A853);display:grid;place-items:center;color:#fff;font-size:1.1rem}
.stats{display:flex;gap:.45rem;flex-wrap:wrap;margin-inline-start:auto;align-items:center}
.chip{display:inline-flex;align-items:center;gap:.3rem;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:.22rem .7rem;font-size:.88rem;font-weight:500;white-space:nowrap}
.chip b{font-weight:700}
.font-ctl{display:flex;gap:.25rem}
.font-ctl button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#fff;font-family:inherit;font-weight:700;cursor:pointer;color:var(--ink);transition:var(--t)}
.font-ctl button:hover,.font-ctl button:focus-visible{transform:translateY(-3px);box-shadow:var(--shadow-h);border-color:var(--primary);color:var(--primary)}
.progress{height:6px;background:var(--line)}
.progress span{display:block;height:100%;background:linear-gradient(90deg,#1A73E8,#34A853);transition:width .8s ease;border-radius:0 4px 4px 0}

/* ---------- Layout ---------- */
main{max-width:1120px;margin:0 auto;padding:28px 16px 64px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:1.5rem;border:1px solid rgba(227,232,239,.7)}
.grid{display:grid;gap:1rem}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.muted{color:var(--muted)}
.fade-in{animation:fadeUp .45s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.stagger>*{animation:fadeUp .45s ease both}
.stagger>*:nth-child(2){animation-delay:.05s}.stagger>*:nth-child(3){animation-delay:.1s}.stagger>*:nth-child(4){animation-delay:.15s}.stagger>*:nth-child(5){animation-delay:.2s}.stagger>*:nth-child(6){animation-delay:.25s}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.75rem 1.4rem;border-radius:12px;border:1.5px solid transparent;font:inherit;font-weight:700;font-size:1rem;cursor:pointer;transition:transform var(--t),box-shadow var(--t),background var(--t),color var(--t),border-color var(--t);text-decoration:none;line-height:1.2}
.btn:hover,.btn:focus-visible{transform:translateY(-3px);box-shadow:var(--shadow-h)}
.btn:active{transform:translateY(-1px)}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover,.btn-primary:focus-visible{background:var(--primary-d)}
.btn-ghost{background:#fff;color:var(--primary);border-color:#C6DAFC}
.btn-ghost:hover,.btn-ghost:focus-visible{background:var(--primary-l);border-color:var(--primary)}
.btn-success{background:var(--success-t);color:#fff}
.btn-success:hover,.btn-success:focus-visible{background:#17692B;box-shadow:0 12px 28px rgba(30,126,52,.25)}
.btn-text{background:none;color:var(--muted);padding:.5rem .8rem}
.btn-text:hover,.btn-text:focus-visible{color:var(--error);background:var(--error-bg);box-shadow:none}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed;transform:none!important;box-shadow:none!important}
.actions{display:flex;gap:.75rem;flex-wrap:wrap;margin-top:1.25rem}

/* ---------- Welcome ---------- */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:2.5rem 2rem;background:linear-gradient(135deg,#E8F0FE 0%,#F1F8F3 100%);border:1px solid #DCE7FA}
.hero::after{content:"";position:absolute;inset-inline-start:-80px;top:-80px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(26,115,232,.16),transparent 70%)}
.hero h1{font-size:clamp(1.7rem,4vw,2.5rem);font-weight:800;max-width:720px}
.hero p.lead{font-size:1.15rem;color:#3C4656;max-width:680px}
.tools-row{display:flex;gap:.5rem;flex-wrap:wrap;margin:1rem 0 0}
.tool-pill{background:#fff;border-radius:999px;padding:.35rem .9rem;font-weight:500;font-size:.92rem;box-shadow:var(--shadow);display:inline-flex;gap:.4rem;align-items:center}
.goals{list-style:none;padding:0;margin:0;display:grid;gap:.6rem}
.goals li{display:flex;gap:.6rem;align-items:flex-start}
.goals li::before{content:"✓";flex:none;width:24px;height:24px;border-radius:50%;background:var(--success-bg);color:var(--success-t);display:grid;place-items:center;font-weight:800;font-size:.85rem;margin-top:.15rem}
.field label{display:block;font-weight:700;margin-bottom:.4rem}
.field input{width:100%;padding:.85rem 1rem;border-radius:12px;border:1.5px solid var(--line);font:inherit;font-size:1.05rem;transition:var(--t);background:#fff;color:var(--ink)}
.field input:focus{border-color:var(--primary);outline:none;box-shadow:0 0 0 4px rgba(26,115,232,.15)}
.field .err{color:var(--error);font-size:.92rem;margin-top:.35rem;min-height:1.3em}
.notice{display:flex;gap:.6rem;background:var(--bg);border-radius:12px;padding:.8rem 1rem;font-size:.92rem;color:var(--muted);margin-top:1rem}

/* ---------- Home ---------- */
.section-title{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin:2.2rem 0 1rem;flex-wrap:wrap}
.section-title h2{margin:0}
.unit-card{position:relative;text-align:start;background:#fff;border-radius:var(--radius);border:1px solid var(--line);padding:1.25rem 1.25rem 1.1rem;cursor:pointer;font:inherit;color:inherit;transition:transform var(--t),box-shadow var(--t),border-color var(--t);display:flex;flex-direction:column;gap:.5rem;min-height:190px;box-shadow:var(--shadow);overflow:hidden}
.unit-card::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--uc)}
.unit-card:hover:not([aria-disabled="true"]),.unit-card:focus-visible{transform:translateY(-4px);box-shadow:0 14px 30px rgba(16,24,40,.12);border-color:var(--uc)}
.unit-card[aria-disabled="true"]{cursor:not-allowed;opacity:.62;background:#FBFCFE}
.unit-ico{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:1.5rem;background:var(--ut)}
.unit-num{font-size:.82rem;font-weight:700;color:var(--muted);letter-spacing:.02em}
.unit-card h3{margin:0;font-size:1.12rem}
.unit-card p{margin:0;font-size:.93rem;color:var(--muted)}
.status{margin-top:auto;display:inline-flex;align-items:center;gap:.35rem;font-size:.85rem;font-weight:700;padding:.2rem .65rem;border-radius:999px;width:max-content}
.st-done{background:var(--success-bg);color:var(--success-t)}
.st-open{background:var(--primary-l);color:var(--primary-d)}
.st-lock{background:#EEF1F5;color:var(--muted)}
.feature{display:flex;flex-direction:column;gap:.5rem}
.feature .big{font-size:2rem}
.badges-shelf{display:flex;flex-wrap:wrap;gap:.75rem}
.badge{display:flex;flex-direction:column;align-items:center;gap:.3rem;width:118px;padding:.9rem .5rem;border-radius:14px;background:#fff;border:1px solid var(--line);text-align:center;font-size:.82rem;font-weight:500;transition:var(--t)}
.badge .b-ico{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:1.55rem;background:var(--gold-bg);box-shadow:inset 0 0 0 3px #FDE293}
.badge.locked{opacity:.45;filter:grayscale(1)}
.badge:not(.locked):hover{transform:translateY(-3px);box-shadow:var(--shadow)}

/* ---------- Unit ---------- */
.unit-hero{border-radius:22px;padding:2rem;background:var(--ut);border:1px solid rgba(0,0,0,.04);position:relative;overflow:hidden}
.unit-hero .unit-ico{background:#fff;box-shadow:var(--shadow);width:60px;height:60px;font-size:1.9rem;margin-bottom:.8rem}
.crumbs{display:flex;gap:.5rem;align-items:center;margin-bottom:1rem;flex-wrap:wrap}
.learn-card{border-inline-start:4px solid var(--uc)}
.learn-card h3{display:flex;gap:.5rem;align-items:center}
.learn-card .n{flex:none;width:28px;height:28px;border-radius:8px;background:var(--ut);color:var(--ink);display:grid;place-items:center;font-size:.9rem;font-weight:800}
.box{border-radius:var(--radius);padding:1.2rem 1.4rem;display:flex;gap:.9rem;align-items:flex-start}
.box .ico{font-size:1.6rem;line-height:1}
.box h3{margin-bottom:.3rem;font-size:1.05rem}
.box p{margin:0}
.box-scn{background:#EEF4FF;border:1px solid #D2E3FC}
.box-tip{background:var(--gold-bg);border:1px solid #FCE8B2}
.box-eth{background:#F3EEFB;border:1px solid #E1D5F5}

/* ---------- Practice ---------- */
.practice-head{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}
.dots{display:flex;gap:.35rem}
.dots span{width:28px;height:7px;border-radius:4px;background:var(--line)}
.dots span.done{background:var(--success)} .dots span.fail{background:#F28B82} .dots span.cur{background:var(--primary)}
.type-tag{display:inline-flex;align-items:center;gap:.35rem;background:var(--ut,var(--primary-l));border-radius:999px;padding:.25rem .8rem;font-size:.85rem;font-weight:700}
.q{font-size:1.2rem;font-weight:700;margin:.8rem 0 1.1rem}
.opts{display:grid;gap:.65rem}
.opt{display:flex;gap:.8rem;align-items:flex-start;text-align:start;width:100%;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:.9rem 1rem;font:inherit;color:inherit;cursor:pointer;transition:transform var(--t),box-shadow var(--t),border-color var(--t),background var(--t)}
.opt:hover:not(:disabled),.opt:focus-visible{transform:translateY(-3px);box-shadow:var(--shadow-h);border-color:var(--primary)}
.opt .let{flex:none;width:30px;height:30px;border-radius:9px;background:var(--bg);display:grid;place-items:center;font-weight:800;font-size:.9rem;border:1px solid var(--line)}
.opt.ok{border-color:var(--success);background:var(--success-bg)} .opt.ok .let{background:var(--success);color:#fff;border-color:var(--success)}
.opt.bad{border-color:var(--error);background:var(--error-bg)} .opt.bad .let{background:var(--error);color:#fff;border-color:var(--error)}
.opt:disabled{cursor:default}
.opt.prompt-opt{font-family:inherit;background:#FAFBFD}
.weak{background:#FFF4F2;border:1.5px dashed #F28B82;border-radius:14px;padding:1rem 1.1rem;margin-bottom:1rem}
.weak small{display:block;font-weight:700;color:var(--error);margin-bottom:.3rem}
.feedback{margin-top:1.1rem;border-radius:14px;padding:1rem 1.2rem;display:none}
.feedback.show{display:block;animation:fadeUp .3s ease}
.feedback.good{background:var(--success-bg);border:1px solid #B7E1C1}
.feedback.badf{background:var(--error-bg);border:1px solid #F6C2BD}
.feedback .fb-title{font-weight:800;margin-bottom:.25rem}
.xp-pop{display:inline-block;background:var(--gold);color:#3B2A00;font-weight:800;border-radius:999px;padding:.1rem .6rem;font-size:.85rem;margin-inline-start:.4rem}

/* match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem}
.m-rows{display:grid;gap:.6rem}
.m-row{display:grid;gap:.35rem}
.m-term{font-weight:700}
.slot{min-height:54px;border:2px dashed #C6D2E3;border-radius:12px;background:#FAFBFD;font:inherit;color:inherit;text-align:start;padding:.55rem .8rem;cursor:pointer;transition:var(--t);width:100%}
.slot:hover,.slot:focus-visible,.slot.over{border-color:var(--primary);background:var(--primary-l)}
.slot.filled{border-style:solid;border-color:#9DB9EA;background:#fff}
.slot.ok{border-color:var(--success);background:var(--success-bg)}
.slot.bad{border-color:var(--error);background:var(--error-bg)}
.slot .ph{color:var(--muted);font-size:.9rem}
.bank{display:flex;flex-direction:column;gap:.55rem;background:var(--bg);border-radius:14px;padding:.8rem;align-content:flex-start;min-height:100px}
.bank-title{font-size:.85rem;color:var(--muted);font-weight:700}
.chip-btn{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:.6rem .8rem;font:inherit;font-size:.95rem;text-align:start;cursor:grab;color:inherit;transition:transform var(--t),box-shadow var(--t),border-color var(--t)}
.chip-btn:hover,.chip-btn:focus-visible{transform:translateY(-3px);box-shadow:var(--shadow-h);border-color:var(--primary)}
.chip-btn[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-l);box-shadow:0 0 0 3px rgba(26,115,232,.2)}
.hint{font-size:.88rem;color:var(--muted);margin:-.4rem 0 .9rem}

/* order */
.order{list-style:none;padding:0;margin:0;display:grid;gap:.55rem}
.order li{display:flex;align-items:center;gap:.7rem;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:.55rem .7rem;transition:var(--t);cursor:grab}
.order li:hover{border-color:#9DB9EA;box-shadow:var(--shadow)}
.order li.dragging{opacity:.5}
.order li.ok{border-color:var(--success);background:var(--success-bg)}
.order li.bad{border-color:var(--error);background:var(--error-bg)}
.order .num{flex:none;width:30px;height:30px;border-radius:9px;background:var(--primary-l);color:var(--primary-d);display:grid;place-items:center;font-weight:800}
.order .txt{flex:1}
.order .mv{display:flex;gap:.25rem}
.order .mv button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:.9rem;transition:var(--t);color:var(--ink)}
.order .mv button:hover:not(:disabled),.order .mv button:focus-visible{transform:translateY(-3px);box-shadow:var(--shadow-h);border-color:var(--primary)}
.order .mv button:disabled{opacity:.3;cursor:default}

/* summary / exam / flash */
.center{text-align:center}
.big-ico{font-size:3.5rem;line-height:1;margin-bottom:.5rem}
.score-ring{--p:0;width:150px;height:150px;border-radius:50%;margin:0 auto 1rem;display:grid;place-items:center;background:conic-gradient(var(--ring,#1A73E8) calc(var(--p)*1%),#E3E8EF 0)}
.score-ring div{width:118px;height:118px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:2rem;font-weight:800}
.review{list-style:none;padding:0;display:grid;gap:.7rem;text-align:start}
.review li{background:#fff;border:1px solid var(--line);border-radius:12px;padding:.9rem 1rem;border-inline-start:4px solid var(--error)}
.timer{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:.6rem 0 1rem}
.timer span{display:block;height:100%;background:linear-gradient(90deg,#34A853,#F9AB00);transition:width .1s linear}
.timer.low span{background:var(--error)}
.flash-top{display:flex;justify-content:space-between;align-items:center;font-weight:700;gap:1rem;flex-wrap:wrap}
.hs{list-style:none;padding:0;margin:0;display:grid;gap:.4rem}
.hs li{display:flex;justify-content:space-between;background:var(--bg);border-radius:10px;padding:.45rem .8rem}
.lock-note{display:flex;gap:.5rem;align-items:center;font-size:.9rem;color:var(--muted)}

/* ---------- Certificate ---------- */
.cert-wrap{display:flex;justify-content:center}
.cert{position:relative;width:100%;max-width:1000px;aspect-ratio:1.414/1;background:#fff;border-radius:6px;box-shadow:0 20px 50px rgba(16,24,40,.15);padding:4.5% 6%;display:flex;flex-direction:column;align-items:center;text-align:center;overflow:hidden}
.cert::before{content:"";position:absolute;inset:14px;border:2px solid #1A73E8;border-radius:4px;pointer-events:none}
.cert::after{content:"";position:absolute;inset:22px;border:1px solid #C6DAFC;border-radius:2px;pointer-events:none}
.cert .corner{position:absolute;width:180px;height:180px;border-radius:50%;filter:blur(2px);opacity:.5}
.cert .c1{top:-90px;right:-90px;background:radial-gradient(circle,#C6DAFC,transparent 70%)}
.cert .c2{bottom:-90px;left:-90px;background:radial-gradient(circle,#CEEAD6,transparent 70%)}
.cert-seal{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#1A73E8,#34A853);color:#fff;display:grid;place-items:center;font-size:1.8rem;box-shadow:0 6px 16px rgba(26,115,232,.3);margin-bottom:.6rem}
.cert-kicker{letter-spacing:.25em;font-weight:700;color:var(--primary);font-size:.85rem}
.cert h1{font-size:clamp(1.3rem,3vw,2.1rem);margin:.2rem 0 .4rem;font-weight:800}
.cert .to{color:var(--muted);margin:0}
.cert .name{font-size:clamp(1.8rem,5vw,3rem);font-weight:800;color:#0F3D82;margin:.1rem 0 .2rem;padding:0 1.5rem .2rem;border-bottom:2px solid #F9AB00}
.cert .desc{max-width:640px;font-size:clamp(.82rem,1.6vw,1rem);margin:.5rem 0}
.cert-stats{display:flex;gap:clamp(.6rem,3vw,2.2rem);justify-content:center;margin:.4rem 0;flex-wrap:wrap}
.cert-stats div{display:flex;flex-direction:column}
.cert-stats b{font-size:clamp(1.05rem,2.6vw,1.6rem);color:#0F3D82}
.cert-stats span{font-size:clamp(.7rem,1.4vw,.85rem);color:var(--muted)}
.cert-units{display:flex;flex-wrap:wrap;gap:.35rem;justify-content:center;max-width:760px;margin:.3rem 0}
.cert-units span{font-size:clamp(.66rem,1.3vw,.8rem);background:#F1F5FC;border-radius:999px;padding:.15rem .6rem}
.cert-badges{font-size:clamp(1.1rem,2.4vw,1.5rem);letter-spacing:.2rem;margin:.2rem 0}
.cert-foot{margin-top:auto;width:100%;display:flex;justify-content:space-between;align-items:flex-end;font-size:clamp(.66rem,1.3vw,.82rem);color:var(--muted);gap:1rem}
.cert-foot .sig{border-top:1px solid #9AA4B2;padding-top:.2rem;min-width:120px}

/* ---------- Toast / confetti ---------- */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(120px);background:#1F2937;color:#fff;padding:.8rem 1.3rem;border-radius:14px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.25);transition:transform .35s ease,visibility .35s;visibility:hidden;z-index:200;max-width:calc(100% - 32px);text-align:center}
.toast.show{transform:translateX(-50%) translateY(0);visibility:visible}
.cf{position:fixed;top:-14px;width:9px;height:14px;border-radius:2px;z-index:300;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}

footer{max-width:1120px;margin:0 auto;padding:0 16px 40px;color:var(--muted);font-size:.85rem;text-align:center}

@media (max-width:640px){
  h1{font-size:1.6rem}
  .hero{padding:1.6rem 1.2rem}
  .card{padding:1.15rem}
  .match{grid-template-columns:1fr}
  .unit-hero{padding:1.4rem}
  .stats .chip.hide-sm{display:none}
  .cert{aspect-ratio:auto;padding:2.2rem 1.4rem}
  .cert-foot{flex-direction:column;align-items:center}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
@media print{
  @page{size:A4 landscape;margin:0}
  body{background:#fff}
  .topbar,.no-print,footer,.toast,.skip,.cf{display:none!important}
  main{padding:0;max-width:none}

const KEY = 'teacher_digital_v1';
function fresh(){ return {name:'', xp:0, streak:0, completed:[], badges:[], items:{}, examBest:null, examPassed:false, certId:null, certDate:null, flash:[], font:1}; }
function load(){ try{ const r = localStorage.getItem(KEY); if(r) return Object.assign(fresh(), JSON.parse(r)); }catch(e){} return fresh(); }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
let S = load();

const $ = s => document.querySelector(s);
const main = $('#main');
const esc = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LETTERS = ['א','ב','ג','ד','ה','ו'];
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function levelName(xp=S.xp){ return xp>=240 ? `מומחה/ית דיגיטלי/ת` : xp>=120 ? `מתקדם/ת` : `מתחיל/ה`; }
function levelIcon(xp=S.xp){ return xp>=240 ? '🏆' : xp>=120 ? '🚀' : '🌱'; }
const reduced = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2800); }
function announce(msg){ const l=$('#live'); l.textContent=''; setTimeout(()=>l.textContent=msg,50); }
function confetti(){
  if(reduced()) return;
  const colors=['#1A73E8','#34A853','#F9AB00','#D93025','#8430CE','#E37400'];
  for(let i=0;i<80;i++){
    const d=document.createElement('div'); d.className='cf';
    d.style.left=Math.random()*100+'vw'; d.style.background=colors[i%colors.length];
    d.style.animationDuration=(1.8+Math.random()*1.6)+'s'; d.style.animationDelay=(Math.random()*.4)+'s';
    d.style.transform=`rotate(${Math.random()*360}deg)`;
    document.body.appendChild(d); setTimeout(()=>d.remove(),4000);
  }
}
function applyFont(){ document.documentElement.style.fontSize=(S.font*100)+'%'; }
function unitUnlocked(i){ return i===0 || S.completed.includes(i-1); }
function allUnitsDone(){ return UNITS.every((_,i)=>S.completed.includes(i)); }
function awardBadge(b){
  if(S.badges.includes(b.id)) return false;
  S.badges.push(b.id); save(); confetti(); toast(`${b.icon} קיבלת תג חדש: ${b.name}`); renderTop(); return true;
}
function checkPrivacyBadge(){
  if(ETHICS_IDS.every(id=>S.items[id]==='first')) awardBadge(PRIVACY_BADGE);
}
let timerId = null;
function clearTimers(){ if(timerId){ clearInterval(timerId); timerId=null; } }
function focusMain(){ main.focus({preventScroll:true}); window.scrollTo({top:0, behavior: reduced()?'auto':'smooth'}); }

/* =====================================================================
   סרגל עליון
   ===================================================================== */
function renderTop(){
  const tb=$('#topbar');
  if(!S.name){ tb.hidden=true; return; }
  tb.hidden=false;
  $('#stats').innerHTML = `
    <span class="chip" title="נקודות ניסיון">⭐ <b>${S.xp}</b> XP</span>
    <span class="chip hide-sm" title="רמה">${levelIcon()} ${levelName()}</span>
    <span class="chip" title="תגים">🏅 <b>${S.badges.length}</b>/${ALL_BADGES.length}</span>
    <span class="chip hide-sm" title="רצף תשובות נכונות">🔥 <b>${S.streak}</b></span>`;
  const pct = Math.round(((S.completed.length + (S.examPassed?1:0)) / (UNITS.length+1))*100);
  $('#progBar').style.width = pct+'%';
  $('#progWrap').setAttribute('aria-valuenow', pct);
  $('#progWrap').setAttribute('aria-valuetext', `${pct}% מהמסלול הושלם`);
}

      ${S.examPassed?`<button class="btn btn-success" id="goCert">לתעודה שלי ←</button>`:`<p class="lock-note">🔒 תיפתח אחרי שתעברו את המבחן המסכם</p>`}</div>

  <div class="badges-shelf">${ALL_BADGES.map(b=>`<div class="badge ${S.badges.includes(b.id)?'':'locked'}" title="${esc(b.name)}"><span class="b-ico" aria-hidden="true">${b.icon}</span>${b.name}<span class="sr-only">${S.badges.includes(b.id)?'– הושג':'– טרם הושג'}</span></div>`).join('')}</div>
  <p class="muted" style="font-size:.88rem;margin-top:.8rem">את התג "שומר/ת הפרטיות" מקבלים כשעונים נכון בניסיון הראשון על כל שאלות האתיקה והפרטיות.</p>
  <div class="actions" style="justify-content:flex-start;margin-top:2rem"><button class="btn btn-text" id="resetBtn">איפוס ההתקדמות</button></div>`;

    const i=+b.dataset.unit;
    if(!unitUnlocked(i)){ toast('🔒 קודם צריך לסיים את היחידה הקודמת'); return; }
    viewUnit(i);
  }));
  $('#goFlash')?.addEventListener('click',viewFlash);
  $('#goExam')?.addEventListener('click',viewExam);

      try{ localStorage.removeItem(KEY); }catch(e){}

/* =====================================================================
   מנוע תרגול
   ===================================================================== */
let P = null;
function startPractice(ui){ P={unit:ui, idx:0, attempts:0, results:[], xpStart:S.xp}; renderItem(); }

function renderItem(){
  const u=UNITS[P.unit], it=u.items[P.idx];
  P.attempts=0; P.finished=false;
  const dots = u.items.map((_,i)=>`<span class="${i<P.idx?(P.results[i]?'done':'fail'):i===P.idx?'cur':''}"></span>`).join('');
  main.innerHTML = `
  <nav class="crumbs"><button class="btn btn-ghost" id="back">→ חזרה ליחידה</button></nav>
  <section class="card fade-in" aria-labelledby="qT">
    <div class="practice-head">
      <span class="type-tag">${TYPE_ICON[it.type]} ${TYPE_LABEL[it.type]}${it.ethics?' · 🛡️ אתיקה ופרטיות':''}</span>
      <div style="display:flex;align-items:center;gap:.7rem"><span class="muted" style="font-size:.9rem">תרגיל ${P.idx+1} מתוך ${u.items.length}</span><div class="dots" aria-hidden="true">${dots}</div></div>
    </div>
    <div id="item"></div>
    <div class="feedback" id="fb" aria-live="polite"></div>
    <div class="actions" id="nextWrap" hidden><button class="btn btn-primary" id="nextBtn">${P.idx<u.items.length-1?'לתרגיל הבא ←':'לסיכום היחידה ←'}</button></div>
  </section>`;
  $('#back').addEventListener('click',()=>viewUnit(P.unit));
  $('#nextBtn').addEventListener('click',()=>{ P.idx++; if(P.idx<u.items.length) renderItem(); else viewSummary(); });
  RENDER[it.type](it, $('#item'));
  focusMain();
}

function lockItem(){ $('#item').querySelectorAll('button,li').forEach(b=>{ if(b.tagName==='BUTTON') b.disabled=true; b.draggable=false; }); }

function submit(correct, opt={}){
  if(P.finished) return;
  const it=UNITS[P.unit].items[P.idx], fb=$('#fb');
  const isNew = !(it.id in S.items);
  if(correct){
    let pts=0, bonus='';
    if(isNew){ pts = P.attempts===0 ? 10 : 5; S.xp+=pts; S.items[it.id] = P.attempts===0 ? 'first' : 'second'; }
    if(P.attempts===0){ S.streak++; if(isNew && S.streak%3===0){ S.xp+=5; bonus=`<span class="xp-pop">🔥 בונוס רצף +5</span>`; } }
    P.results[P.idx]=true; P.finished=true;
    fb.className='feedback show good';
    fb.innerHTML=`<div class="fb-title">✔️ נכון!${pts?`<span class="xp-pop">+${pts} XP</span>`:''}${bonus}</div><div>${it.explain}</div>${!isNew?'<div class="muted" style="font-size:.88rem;margin-top:.3rem">כבר תרגלתם את התרגיל הזה, ולכן לא נוספו נקודות.</div>':''}`;
    announce('תשובה נכונה. '+it.explain.replace(/<[^>]+>/g,''));
    lockItem(); $('#nextWrap').hidden=false; save(); renderTop();
    if(it.ethics) checkPrivacyBadge();
    $('#nextBtn').focus({preventScroll:true});
  } else {
    P.attempts++; S.streak=0;
    if(P.attempts<2){
      fb.className='feedback show badf';
      fb.innerHTML=`<div class="fb-title">✖️ לא מדויק. נסו שוב (בניסיון השני מקבלים 5 XP).</div>${opt.fb?`<div>${opt.fb}</div>`:''}`;
      announce('לא מדויק. '+(opt.fb||'')+' נסו שוב.');
    } else {
      if(isNew) S.items[it.id]='fail';
      P.results[P.idx]=false; P.finished=true;
      opt.reveal && opt.reveal();
      fb.className='feedback show badf';
      fb.innerHTML=`<div class="fb-title">✖️ הפעם זה לא הצליח. התשובה הנכונה מסומנת.</div>${opt.fb?`<div>${opt.fb}</div>`:''}<div style="margin-top:.3rem">${it.explain}</div>`;
      announce('התשובה הנכונה מסומנת. '+it.explain);
      lockItem(); $('#nextWrap').hidden=false; $('#nextBtn').focus({preventScroll:true});
    }
    save(); renderTop();
  }
}

/* --- בחירה מרובה / נכון-לא נכון / פרומפט --- */
function renderChoice(el, it, options, answer, extraHtml='', cls=''){
  el.innerHTML = `${extraHtml}<p class="q" id="qT">${it.q}</p><div class="opts" role="group" aria-labelledby="qT">${options.map((o,i)=>`<button class="opt ${cls}" data-i="${i}"><span class="let" aria-hidden="true">${LETTERS[i]}</span><span>${o}</span></button>`).join('')}</div>`;
  const btns=[...el.querySelectorAll('.opt')];
  const reveal=()=>btns[answer].classList.add('ok');
  btns.forEach(b=>b.addEventListener('click',()=>{
    const i=+b.dataset.i;
    if(i===answer){ b.classList.add('ok'); submit(true); }
    else { b.classList.add('bad'); b.disabled=true; submit(false,{reveal}); }
  }));
}
const RENDER = {
  mc:(it,el)=>renderChoice(el,it,it.options,it.answer),
  tf:(it,el)=>renderChoice(el,it,['נכון','לא נכון'],it.answer?0:1),
  prompt:(it,el)=>renderChoice(el,it,it.options,it.answer,`<div class="weak"><small>פרומפט חלש:</small>"${it.weak}"</div>`,'prompt-opt'),
  scenario:(it,el)=>{
    el.innerHTML=`<p class="q" id="qT">${it.q}</p><div class="opts" role="group" aria-labelledby="qT">${it.options.map((o,i)=>`<button class="opt" data-i="${i}"><span class="let" aria-hidden="true">${LETTERS[i]}</span><span>${o.t}</span></button>`).join('')}</div>`;
    const btns=[...el.querySelectorAll('.opt')];
    const bi=it.options.findIndex(o=>o.best);
    const reveal=()=>btns[bi].classList.add('ok');
    btns.forEach(b=>b.addEventListener('click',()=>{
      const o=it.options[+b.dataset.i];
      if(o.best){ b.classList.add('ok'); submit(true); }
      else { b.classList.add('bad'); b.disabled=true; submit(false,{fb:o.fb, reveal}); }
    }));
  },
  match:(it,el)=>{
    const n=it.pairs.length;
    let assign=Array(n).fill(null), sel=null, marks=null;
    const order=shuffle([...Array(n).keys()]);
    function draw(focusKey){
      const used=new Set(assign.filter(v=>v!==null));
      el.innerHTML=`<p class="q" id="qT">${it.q}</p>
      <p class="hint">גררו כל תיאור למקום המתאים, או לחצו על תיאור ואחר כך על המקום. לחיצה על מקום מלא מחזירה את התיאור לרשימה.</p>
      <div class="match">
        <div class="m-rows">${it.pairs.map((p,t)=>`<div class="m-row"><span class="m-term" id="term${t}">${p[0]}</span>
          <button class="slot ${assign[t]!==null?'filled':''} ${marks?(marks[t]?'ok':'bad'):''}" data-t="${t}" data-k="s${t}" aria-describedby="term${t}" aria-label="מקום עבור ${esc(p[0])}: ${assign[t]!==null?esc(it.pairs[assign[t]][1]):'ריק'}">${assign[t]!==null?it.pairs[assign[t]][1]:'<span class="ph">שחררו כאן תיאור</span>'}</button></div>`).join('')}</div>
        <div class="bank" aria-label="תיאורים לשיבוץ"><span class="bank-title">תיאורים לשיבוץ</span>${order.filter(d=>!used.has(d)).map(d=>`<button class="chip-btn" draggable="true" data-d="${d}" data-k="d${d}" aria-pressed="${sel===d}">${it.pairs[d][1]}</button>`).join('') || '<span class="muted" style="font-size:.9rem">כל התיאורים שובצו ✓</span>'}</div>
      </div>
      <div class="actions"><button class="btn btn-primary" id="chk" ${assign.includes(null)?'disabled':''}>בדיקה</button></div>`;
      el.querySelectorAll('.chip-btn').forEach(c=>{
        c.addEventListener('click',()=>{ const d=+c.dataset.d; sel = sel===d?null:d; draw('d'+d); });
        c.addEventListener('dragstart',e=>{ e.dataTransfer.setData('text/plain',c.dataset.d); sel=+c.dataset.d; });
      });
      el.querySelectorAll('.slot').forEach(s=>{
        const t=+s.dataset.t;
        s.addEventListener('click',()=>{
          if(P.finished) return;
          marks=null;
          if(sel!==null){ assign[t]=sel; sel=null; }
          else if(assign[t]!==null){ assign[t]=null; }
          else { toast('בחרו קודם תיאור מהרשימה'); return; }
          draw('s'+t);
        });
        s.addEventListener('dragover',e=>{ e.preventDefault(); s.classList.add('over'); });
        s.addEventListener('dragleave',()=>s.classList.remove('over'));
        s.addEventListener('drop',e=>{ e.preventDefault(); const d=+e.dataTransfer.getData('text/plain'); if(isNaN(d)) return; marks=null; assign[t]=d; sel=null; draw('s'+t); });
      });
      const chk=el.querySelector('#chk');
      chk.addEventListener('click',()=>{
        marks=assign.map((d,t)=>d===t);
        const ok=marks.every(Boolean);
        draw();
        submit(ok,{fb: ok?'':`מקומות שסומנו באדום שובצו לא נכון.`, reveal:()=>{ assign=[...Array(n).keys()]; marks=Array(n).fill(true); draw(); }});
        if(P.finished) lockItem();
      });
      if(focusKey){ const f=el.querySelector(`[data-k="${focusKey}"]`); f && f.focus({preventScroll:true}); }
    }
    draw();
  },
  order:(it,el)=>{
    const n=it.steps.length;
    let arr; do{ arr=shuffle([...Array(n).keys()]); }while(arr.every((v,i)=>v===i));
    let marks=null, dragFrom=null;
    function draw(focusSel){
      el.innerHTML=`<p class="q" id="qT">${it.q}</p>
      <p class="hint">גררו את השלבים, או השתמשו בחיצים ▲▼ כדי להזיז שלב למעלה או למטה.</p>
      <ol class="order" aria-labelledby="qT">${arr.map((s,i)=>`<li draggable="true" data-i="${i}" class="${marks?(marks[i]?'ok':'bad'):''}"><span class="num" aria-hidden="true">${i+1}</span><span class="txt">${it.steps[s]}</span>
        <span class="mv"><button data-up="${i}" aria-label="הזזת '${esc(it.steps[s])}' למעלה" ${i===0?'disabled':''}>▲</button><button data-dn="${i}" aria-label="הזזת '${esc(it.steps[s])}' למטה" ${i===n-1?'disabled':''}>▼</button></span></li>`).join('')}</ol>
      <div class="actions"><button class="btn btn-primary" id="chk">בדיקה</button></div>`;
      const swap=(a,b)=>{ [arr[a],arr[b]]=[arr[b],arr[a]]; marks=null; };
      el.querySelectorAll('[data-up]').forEach(b=>b.addEventListener('click',()=>{ const i=+b.dataset.up; swap(i,i-1); draw(i-1>0?`[data-up="${i-1}"]`:`[data-dn="${i-1}"]`); }));
      el.querySelectorAll('[data-dn]').forEach(b=>b.addEventListener('click',()=>{ const i=+b.dataset.dn; swap(i,i+1); draw(i+1<n-1?`[data-dn="${i+1}"]`:`[data-up="${i+1}"]`); }));
      el.querySelectorAll('.order li').forEach(li=>{
        li.addEventListener('dragstart',()=>{ dragFrom=+li.dataset.i; li.classList.add('dragging'); });
        li.addEventListener('dragend',()=>li.classList.remove('dragging'));
        li.addEventListener('dragover',e=>e.preventDefault());
        li.addEventListener('drop',e=>{ e.preventDefault(); const to=+li.dataset.i; if(dragFrom===null||dragFrom===to) return; const [m]=arr.splice(dragFrom,1); arr.splice(to,0,m); marks=null; dragFrom=null; draw(); });
      });
      el.querySelector('#chk').addEventListener('click',()=>{
        marks=arr.map((v,i)=>v===i);
        const ok=marks.every(Boolean);
        draw();
        submit(ok,{fb: ok?'':'שלבים שמסומנים באדום לא נמצאים במקום הנכון.', reveal:()=>{ arr=[...Array(n).keys()]; marks=Array(n).fill(true); draw(); }});
        if(P.finished) lockItem();
      });
      if(focusSel){ const f=el.querySelector(focusSel); f && f.focus({preventScroll:true}); }
    }
    draw();
  }
};

    <div class="grid g3" style="margin:1.2rem 0;grid-template-columns:repeat(3,1fr)">
      <div class="card" style="padding:1rem"><b style="font-size:1.6rem">${correct}/${u.items.length}</b><div class="muted" style="font-size:.88rem">תשובות נכונות</div></div>
      <div class="card" style="padding:1rem"><b style="font-size:1.6rem">+${gained}</b><div class="muted" style="font-size:.88rem">XP ביחידה</div></div>

    <div class="actions" style="justify-content:center">
      ${ui<UNITS.length-1?`<button class="btn btn-primary" id="nextUnit">ליחידה ${ui+2} ←</button>`:`<button class="btn btn-primary" id="toHome">לאתגר ולמבחן המסכם ←</button>`}

/* =====================================================================
   מבחן מסכם
   ===================================================================== */
function viewExam(){
  clearTimers();
  const E={qs:shuffle(EXAM), i:0, ans:[]};
  function q(){
    const it=E.qs[E.i];
    main.innerHTML=`
    <nav class="crumbs"><button class="btn btn-ghost" id="back">→ יציאה מהמבחן</button></nav>
    <section class="card fade-in" style="max-width:760px;margin:0 auto">
      <div class="practice-head"><span class="type-tag" style="background:var(--primary-l)">📝 מבחן מסכם</span><span class="muted">שאלה ${E.i+1} מתוך ${E.qs.length}</span></div>
      <div class="timer" aria-hidden="true"><span style="width:${(E.i/E.qs.length)*100}%;background:var(--primary)"></span></div>
      <p class="q" id="qT">${it.q}</p>
      <div class="opts" role="group" aria-labelledby="qT">${it.options.map((o,i)=>`<button class="opt" data-i="${i}"><span class="let" aria-hidden="true">${LETTERS[i]}</span><span>${o}</span></button>`).join('')}</div>
      <p class="muted" style="font-size:.88rem;margin-top:1rem">במבחן אין משוב מיידי. בסוף תקבלו ציון וסקירה של הטעויות.</p>
    </section>`;
    $('#back').addEventListener('click',()=>{ if(confirm('לצאת מהמבחן? התשובות שלכם לא יישמרו.')) viewHome(); });
    main.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{
      E.ans.push(+b.dataset.i); E.i++;
      if(E.i<E.qs.length) q(); else result();
    }));
    focusMain();
  }
  function result(){
    const correct=E.qs.filter((it,i)=>E.ans[i]===it.answer).length;
    const score=Math.round(correct/E.qs.length*100);
    const passed=score>=PASS;
    S.examBest=Math.max(S.examBest??0,score);
    let newly=false;
    if(passed && !S.examPassed){ S.examPassed=true; newly=true; S.certDate=new Date().toISOString();
      S.certId='DT-'+new Date().getFullYear()+'-'+Math.random().toString(36).slice(2,8).toUpperCase(); }
    save(); renderTop();
    const wrong=E.qs.map((it,i)=>({it,a:E.ans[i]})).filter(x=>x.a!==x.it.answer);
    main.innerHTML=`
    <section class="card center fade-in" style="max-width:760px;margin:0 auto">
      <div class="score-ring" style="--p:${score};--ring:${passed?'#34A853':'#D93025'}" role="img" aria-label="ציון ${score}"><div>${score}</div></div>
      <h1>${passed?'עברתם את המבחן! 🎉':'עוד קצת ותגיעו לשם'}</h1>
      <p class="muted">${correct} תשובות נכונות מתוך ${E.qs.length}. ציון המעבר הוא ${PASS}.${passed?'':' מומלץ לחזור על היחידות הרלוונטיות ולנסות שוב.'}</p>
      ${wrong.length?`<h2 style="font-size:1.15rem;text-align:start;margin-top:1.4rem">סקירת טעויות</h2><ul class="review">${wrong.map(x=>`<li><b>${x.it.q}</b><div style="margin-top:.3rem">התשובה שלכם: <span style="color:var(--error)">${x.it.options[x.a]}</span></div><div>התשובה הנכונה: <span style="color:var(--success-t);font-weight:700">${x.it.options[x.it.answer]}</span></div><div class="muted" style="font-size:.92rem;margin-top:.2rem">${x.it.explain}</div></li>`).join('')}</ul>`:'<p>ענית נכון על כל השאלות. מושלם! 🌟</p>'}
      <div class="actions" style="justify-content:center">
        ${S.examPassed?`<button class="btn btn-success" id="goCert">לתעודת הסיום 🎓</button>`:''}
        <button class="btn btn-ghost" id="retry">ניסיון נוסף</button>
        <button class="btn btn-ghost" id="home3">למפת הלמידה</button>
      </div>
    </section>`;
    if(passed) confetti();
    if(newly) toast('🎓 התעודה שלכם מוכנה!');
    $('#goCert')?.addEventListener('click',viewCert);
    $('#retry').addEventListener('click',viewExam);
    $('#home3').addEventListener('click',viewHome);
    focusMain();
  }
  q();
}

/* =====================================================================
   אתגר הבזק
   ===================================================================== */
function flashPool(){
  const pool=EXAM.map(e=>({q:e.q,options:e.options,answer:e.answer}));
  UNITS.forEach(u=>u.items.forEach(it=>{
    if(it.type==='mc') pool.push({q:it.q,options:it.options,answer:it.answer});
    if(it.type==='tf') pool.push({q:it.q,options:['נכון','לא נכון'],answer:it.answer?0:1});
  }));
  return shuffle(pool).slice(0,10);
}
function viewFlash(){
  clearTimers();
  main.innerHTML=`
  <nav class="crumbs"><button class="btn btn-ghost" id="back">→ למפת הלמידה</button></nav>
  <section class="card center fade-in" style="max-width:640px;margin:0 auto">
    <div class="big-ico" aria-hidden="true">⚡</div>
    <h1>אתגר הבזק</h1>
    <p class="muted">10 שאלות מכל היחידות, ו-20 שניות לכל שאלה. כל תשובה נכונה שווה נקודה. נסו לשבור את השיא שלכם!</p>
    ${S.flash.length?`<h2 style="font-size:1.05rem;margin-top:1.2rem">🏆 לוח השיאים שלי</h2><ol class="hs">${S.flash.slice(0,5).map((f,i)=>`<li><span>${['🥇','🥈','🥉','4.','5.'][i]} ${new Date(f.date).toLocaleDateString('he-IL')}</span><b>${f.score}/10</b></li>`).join('')}</ol>`:''}
    <div class="actions" style="justify-content:center"><button class="btn btn-primary" id="go">התחלה ←</button></div>
  </section>`;
  $('#back').addEventListener('click',viewHome);
  $('#go').addEventListener('click',()=>run());
  focusMain();
  function run(){
    const F={qs:flashPool(), i:0, score:0};
    function q(){
      clearTimers();
      const it=F.qs[F.i]; let left=20, locked=false;
      main.innerHTML=`
      <section class="card fade-in" style="max-width:760px;margin:0 auto">
        <div class="flash-top"><span>⚡ שאלה ${F.i+1}/10</span><span>ניקוד: ${F.score}</span><span id="secs" aria-live="off">20 שנ'</span></div>
        <div class="timer" id="tm"><span style="width:100%"></span></div>
        <p class="q" id="qT">${it.q}</p>
        <div class="opts" role="group" aria-labelledby="qT">${it.options.map((o,i)=>`<button class="opt" data-i="${i}"><span class="let" aria-hidden="true">${LETTERS[i]}</span><span>${o}</span></button>`).join('')}</div>
        <div class="feedback" id="fb" aria-live="polite"></div>
      </section>`;
      const btns=[...main.querySelectorAll('.opt')];
      const bar=main.querySelector('#tm span'), tm=main.querySelector('#tm'), secs=main.querySelector('#secs');
      const t0=Date.now();
      function finish(i){
        if(locked) return; locked=true; clearTimers();
        btns.forEach(b=>b.disabled=true);
        btns[it.answer].classList.add('ok');
        const fb=main.querySelector('#fb');
        if(i===it.answer){ F.score++; fb.className='feedback show good'; fb.innerHTML='<div class="fb-title">✔️ נכון!</div>'; }
        else { if(i!==null) btns[i].classList.add('bad'); fb.className='feedback show badf'; fb.innerHTML=`<div class="fb-title">${i===null?'⏰ נגמר הזמן!':'✖️ לא נכון'}</div>`; }
        announce(i===it.answer?'נכון':'לא נכון. התשובה הנכונה: '+it.options[it.answer]);
        setTimeout(()=>{ F.i++; if(F.i<F.qs.length) q(); else end(); }, 1300);
      }
      btns.forEach(b=>b.addEventListener('click',()=>finish(+b.dataset.i)));
      timerId=setInterval(()=>{
        left=Math.max(0,20-(Date.now()-t0)/1000);
        bar.style.width=(left/20*100)+'%';
        secs.textContent=Math.ceil(left)+" שנ'";
        tm.classList.toggle('low',left<=5);
        if(left<=0) finish(null);
      },100);
      btns[0].focus({preventScroll:true});
    }
    function end(){
      clearTimers();
      const prevBest=S.flash.length?Math.max(...S.flash.map(f=>f.score)):-1;
      S.flash.push({score:F.score,date:new Date().toISOString()});
      S.flash.sort((a,b)=>b.score-a.score||new Date(b.date)-new Date(a.date));
      S.flash=S.flash.slice(0,5); save();
      const record=F.score>prevBest;
      if(record) confetti();
      main.innerHTML=`
      <section class="card center fade-in" style="max-width:640px;margin:0 auto">
        <div class="score-ring" style="--p:${F.score*10};--ring:#F9AB00" role="img" aria-label="ניקוד ${F.score} מתוך 10"><div>${F.score}/10</div></div>
        <h1>${record?'🏆 שיא אישי חדש!':'כל הכבוד על ההשתתפות!'}</h1>
        <p class="muted">${F.score>=8?'שליטה מצוינת בחומר.':F.score>=5?'בסיס טוב. נסו שוב כדי לשפר את השיא.':'כדאי לחזור על היחידות ולנסות שוב.'}</p>
        <div class="actions" style="justify-content:center"><button class="btn btn-primary" id="again">שוב! ⚡</button><button class="btn btn-ghost" id="home4">למפת הלמידה</button></div>
      </section>`;
      $('#again').addEventListener('click',run);
      $('#home4').addEventListener('click',viewHome);
      focusMain();
    }
    q();
  }
}

/* =====================================================================
   תעודת סיום
   ===================================================================== */
function viewCert(){
  clearTimers();
  if(!S.examPassed){ viewHome(); return; }
  const earned=ALL_BADGES.filter(b=>S.badges.includes(b.id));
  const date=new Date(S.certDate||Date.now()).toLocaleDateString('he-IL',{day:'numeric',month:'long',year:'numeric'});
  main.innerHTML=`
  <nav class="crumbs no-print"><button class="btn btn-ghost" id="back">→ למפת הלמידה</button><button class="btn btn-primary" id="print">🖨️ הדפסה / שמירה כ-PDF</button></nav>
  <div class="cert-wrap fade-in">
    <article class="cert" aria-label="תעודת סיום">
      <span class="corner c1"></span><span class="corner c2"></span>
      <div class="cert-seal" aria-hidden="true">🎓</div>
      <div class="cert-kicker">תעודת סיום</div>
      <h1>הוראה דיגיטלית בסביבת ענן ובינה מלאכותית</h1>
      <p class="to">התעודה מוענקת ל</p>
      <div class="name">${esc(S.name)}</div>
      <p class="desc">על השלמת מסלול הלמידה בנושא ניהול כיתה ב-Google Classroom ושימוש פדגוגי, בטוח ואחראי, ב-Gemini, ב-NotebookLM וב-Google Meet.</p>
      <div class="cert-stats">
        <div><b>${S.examBest}</b><span>ציון במבחן המסכם</span></div>
        <div><b>${S.xp}</b><span>נקודות XP</span></div>
        <div><b>${levelName()}</b><span>רמה</span></div>
        <div><b>${earned.length}/${ALL_BADGES.length}</b><span>תגים</span></div>
      </div>
      <div class="cert-units">${UNITS.map(u=>`<span>✓ ${u.title}</span>`).join('')}</div>
      <div class="cert-badges" aria-label="תגים שהושגו: ${esc(earned.map(b=>b.name).join(', '))}">${earned.map(b=>`<span title="${esc(b.name)}">${b.icon}</span>`).join('')}</div>
      <div class="cert-foot">
        <div class="sig">תאריך: ${date}</div>
        <div>מספר תעודה: <b>${S.certId}</b></div>
        <div class="sig">מסלול הכשרה עצמית למורים</div>
      </div>
    </article>
  </div>
  <p class="muted center no-print" style="font-size:.88rem;margin-top:1rem">טיפ: בחלון ההדפסה בחרו "שמירה כ-PDF", בכיוון "לרוחב", והפעילו "גרפיקת רקע".</p>`;
  $('#back').addEventListener('click',viewHome);
  $('#print').addEventListener('click',()=>window.print());
  focusMain();
}

/* =====================================================================
   אתחול
   ===================================================================== */
$('#brandBtn').addEventListener('click',viewHome);
$('#fontUp').addEventListener('click',()=>{ S.font=Math.min(1.3,+(S.font+.1).toFixed(1)); applyFont(); save(); });
$('#fontDown').addEventListener('click',()=>{ S.font=Math.max(.9,+(S.font-.1).toFixed(1)); applyFont(); save(); });
applyFont(); renderTop();
if(S.name) viewHome(); else viewWelcome();
</script>
